* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;

}
body {
  font-family: monospace;
  background: #000;
  color: #ddd;
  padding: 12px;
  padding-top: env(safe-area-inset-top, 12px);
  padding-bottom: env(safe-area-inset-bottom, 12px);
  display: flex;
  flex-direction: column;
}
body.theme-dark {
  background: var(--tg-theme-bg-color, #000);
  color: var(--tg-theme-text-color, #ddd);
}
body.theme-light {
  background: var(--tg-theme-bg-color, #fff);
  color: var(--tg-theme-text-color, #000);
}
h1 {
  color: var(--tg-theme-hint-color, cyan);
  margin: 8px 0;
  font-size: 18px;
}
h2 {
  border-bottom: 1px solid var(--tg-theme-hint-color, gray);
  padding-bottom: 4px;
  margin-top: 20px;
  font-size: 14px;
  color: var(--tg-theme-hint-color, #aaa);
}
input {
  background: var(--tg-theme-bg-color, #000);
  color: var(--tg-theme-text-color, #ddd);
  border: 1px solid var(--tg-theme-hint-color, #444);
  padding: 10px;
  width: 100%;
  font-family: monospace;
  font-size: 16px;
  margin-bottom: 8px;
  outline: none;
}
input:focus {
  border-color: var(--tg-theme-button-color, cyan);
}
.entry {
  margin: 8px 0;
  padding: 8px;
  border: 1px solid #333;
  word-wrap: break-word;
}
.entry b { color: var(--tg-theme-text-color, #fff); }
.entry .meta { color: var(--tg-theme-hint-color, #888); font-size: 12px; }
.entry a { color: var(--tg-theme-button-color, cyan); }
.group {
  border: 1px solid #333;
  margin: 8px 0;
}
.group summary {
  cursor: pointer;
  padding: 8px;
  color: var(--tg-theme-text-color, #fff);
  font-weight: bold;
  list-style: none;
}
.group summary::-webkit-details-marker { display: none; }
.group summary::before {
  content: "\25B8 ";
  color: var(--tg-theme-button-color, cyan);
}
.group[open] summary::before {
  content: "\25BE ";
}
.group summary .count {
  color: var(--tg-theme-hint-color, #888);
  font-weight: normal;
  font-size: 12px;
}
.group .entries {
  padding: 0 8px 8px 8px;
}
.group .entry:first-child {
  border-color: #0aa;
}
.filters {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
select {
  background: var(--tg-theme-bg-color, #000);
  color: var(--tg-theme-text-color, #ddd);
  border: 1px solid var(--tg-theme-hint-color, #444);
  padding: 8px;
  font-family: monospace;
  font-size: 13px;
  flex: 1;
  min-width: 120px;
  outline: none;
}
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 0 8px;
}
.tabs button {
  background: var(--tg-theme-bg-color, #000);
  color: var(--tg-theme-text-color, #ddd);
  border: 1px solid var(--tg-theme-hint-color, #444);
  padding: 6px 12px;
  font-family: monospace;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  outline: none;
}
.tabs button.active {
  background: var(--tg-theme-button-color, cyan);
  border-color: var(--tg-theme-button-color, cyan);
  color: var(--tg-theme-button-text-color, #000);
  font-weight: bold;
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: normal;
  border: 1px solid var(--tg-theme-button-color, #0aa);
  color: var(--tg-theme-button-color, #0aa);
  padding: 0 5px;
  margin-left: 6px;
  vertical-align: middle;
  white-space: nowrap;
}
.badge.warn {
  border-color: #aa0;
  color: #aa0;
}
.check {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  padding: 8px 0;
  cursor: pointer;
  white-space: nowrap;
}
.check input {
  width: auto;
  margin: 0;
}
.copybtn {
  background: none;
  border: 1px solid var(--tg-theme-hint-color, #444);
  color: var(--tg-theme-hint-color, #888);
  font-family: monospace;
  font-size: 11px;
  padding: 0 5px;
  margin-left: 6px;
  cursor: pointer;
  vertical-align: middle;
}
.entry.flash {
  animation: flash 2s ease-out;
}
@keyframes flash {
  0%, 40% { border-color: var(--tg-theme-button-color, #0aa); }
  100% { border-color: #333; }
}
footer {
  text-align: center;
  color: var(--tg-theme-hint-color, #666);
  font-size: 12px;
  padding: 8px 0 4px;
}
footer a {
  color: var(--tg-theme-button-color, cyan);
  text-decoration: none;
}
#empty {
  text-align: center;
  color: var(--tg-theme-hint-color, #888);
  padding: 30px 0;
}
#empty button {
  background: var(--tg-theme-bg-color, #000);
  color: var(--tg-theme-button-color, cyan);
  border: 1px solid var(--tg-theme-hint-color, #444);
  padding: 6px 12px;
  font-family: monospace;
  cursor: pointer;
}
#out {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

name: Send Bot Changelog

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send message to all chats
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          MSG_TEXT=$(cat update.txt)
          IFS=',' read -ra IDS <<< "$CHAT_IDS"
          for ID in "${IDS[@]}"; do
            ID_TRIMMED=$(echo "$ID" | xargs)
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${ID_TRIMMED}" \
              -d "parse_mode=MarkdownV2" \
              --data-urlencode "text=${MSG_TEXT}"
            echo ""
          done

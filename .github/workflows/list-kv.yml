name: List KV Namespaces

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: List KV namespaces
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces")
          gh issue create --repo "${{ github.repository }}" --title "kv-namespaces-debug" --body "$RESULT" --label "debug"

name: Check Bot Info

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Get bot info
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe")
          gh issue create --repo "${{ github.repository }}" --title "getme-debug" --body "$RESULT" --label "debug"

name: Notify Telegram

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify:
    if: contains(github.event.issue.labels.*.name, 'svault-notify')
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TEXT: ${{ github.event.issue.body }}
        run: |
          IFS=',' read -ra IDS <<< "$CHAT_IDS"
          for ID in "${IDS[@]}"; do
            ID_TRIMMED=$(echo "$ID" | xargs)
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${ID_TRIMMED}" \
              -d "parse_mode=MarkdownV2" \
              --data-urlencode "text=${TEXT}"
            echo ""
          done

      - name: Close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"

name: Deploy svault-bot

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler secret put TELEGRAM_BOT_TOKEN --name svault-bot 2>&1 | tee /tmp/secret_output.log <<< "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          wrangler deploy 2>&1 | tee /tmp/deploy_output.log

      - name: Report failure
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat /tmp/deploy_output.log /tmp/secret_output.log 2>/dev/null | tail -c 60000 || echo "no log captured")
          gh issue create --repo "${{ github.repository }}" --title "deploy-failure-debug" --body "$BODY" --label "debug"
          exit 1

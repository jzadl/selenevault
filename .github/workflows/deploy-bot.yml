name: Deploy svault-bot

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler secret put TELEGRAM_BOT_TOKEN --name svault-bot 2>&1 | tee /tmp/secret_output.log <<< "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          wrangler secret put GROQ_API_KEY --name svault-bot 2>&1 | tee -a /tmp/secret_output.log <<< "${{ secrets.GROQ_API_KEY }}"
          wrangler secret put GITHUB_TOKEN --name svault-bot 2>&1 | tee -a /tmp/secret_output.log <<< "${{ secrets.PUSH_TOKEN }}"
          wrangler deploy 2>&1 | tee /tmp/deploy_output.log

      - name: Report deploy output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "--- raw log size ---"
          wc -c /tmp/deploy_output.log 2>&1 || echo "log file missing"
          echo "--- first 2000 chars ---"
          head -c 2000 /tmp/deploy_output.log 2>&1 > /tmp/short_log.txt || echo "no log" > /tmp/short_log.txt
          gh issue create --repo "${{ github.repository }}" --title "deploy-output-debug" --body-file /tmp/short_log.txt --label "debug" || echo "gh issue create failed with code $?"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>selenevault</title>
<meta name="description" content="Community archive of ROMs, kernels, recoveries, firmware, ports, tools, guides and channels for the Xiaomi Redmi 10 (selene).">

<!-- Open Graph / WhatsApp / Telegram -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://svault.jzadl.xyz">
<meta property="og:title" content="selenevault">
<meta property="og:description" content="Community archive of ROMs, kernels, recoveries, firmware, ports, tools, guides and channels for the Xiaomi Redmi 10 (selene).">
<meta property="og:image" content="https://cdn.jzadl.xyz/svault/logo.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="300">
<meta property="og:image:height" content="300">

<!-- Twitter -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="selenevault">
<meta name="twitter:description" content="Community archive of ROMs, kernels, recoveries, firmware, ports, tools, guides and channels for the Xiaomi Redmi 10 (selene).">
<meta name="twitter:image" content="https://cdn.jzadl.xyz/svault/logo.png">

<style>
:root{
  --bg:#0a0b0a;
  --bg-raised:#111312;
  --bg-hover:#161917;
  --line:#232725;
  --line-soft:#1a1d1b;
  --text:#dfe4e0;
  --text-dim:#7c8681;
  --text-faint:#4d544f;
  --accent:#7dd3c0;
  --accent-dim:#4a8c7d;
  --warn:#e8a94c;
  --bad:#e0715f;
  --good:#8fbf6f;
  --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  --radius: 3px;
}
*{ box-sizing:border-box; }
::selection{ background:var(--accent); color:#06110d; }
html{ scrollbar-color: var(--line) var(--bg); }
body{
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  margin:0;
  font-size: 14px;
  line-height: 1.5;
}
a{ color:var(--accent); text-decoration:none; }
a:hover{ text-decoration:underline; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible{
  outline: 1px solid var(--accent);
  outline-offset: 2px;
}

.shell{
  display:grid;
  grid-template-columns: 220px 1fr;
  min-height:100vh;
}
@media (max-width: 860px){
  .shell{ grid-template-columns: 1fr; }
  .sidebar{ position: static; border-right:none; border-bottom:1px solid var(--line); }
}

.sidebar{
  border-right:1px solid var(--line);
  padding: 18px 14px;
  position: sticky;
  top:0;
  align-self: start;
  height: 100vh;
  overflow-y: auto;
}
@media (max-width: 860px){ .sidebar{ height:auto; overflow:visible; } }

.brand{ display:flex; align-items:baseline; gap:8px; margin-bottom: 4px; }
.brand .dot{ color:var(--accent); }
.brand h1{ font-size: 16px; margin:0; letter-spacing: -0.02em; color:#fff; font-weight:600; }
.tagline{ color:var(--text-dim); font-size:11.5px; margin: 4px 0 18px; }

.nav-group{ margin-bottom: 18px; }
.nav-label{ color:var(--text-faint); font-size:10px; text-transform:uppercase; letter-spacing:.08em; margin: 0 0 6px 2px; }
.nav-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 8px; border-radius:var(--radius); cursor:pointer;
  color:var(--text-dim); font-size:13px; border: 1px solid transparent;
}
.nav-item:hover{ background:var(--bg-hover); color:var(--text); }
.nav-item.active{ background:var(--bg-raised); color:var(--accent); border-color: var(--line); }
.nav-item .count{ font-size:11px; color:var(--text-faint); }
.nav-item.active .count{ color: var(--accent-dim); }

.side-foot{ margin-top: 12px; padding-top:12px; border-top:1px solid var(--line-soft); }
.side-foot a{ display:block; color:var(--text-dim); font-size:12px; margin-bottom:4px; }
.side-foot a:hover{ color:var(--accent); }

main{ padding: 22px 24px 60px; max-width: 980px; }
@media (max-width: 860px){ main{ padding: 16px 14px 50px; } }

.topbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom: 14px; }
.search-wrap{ position:relative; flex: 1 1 260px; min-width: 200px; }
.search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5; width:14px; height:14px; }
#search{
  background: var(--bg-raised); color: var(--text); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 9px 10px 9px 30px; width: 100%;
  font-family: var(--mono); font-size: 13.5px;
}
#search::placeholder{ color: var(--text-faint); }
#search:focus{ border-color: var(--accent-dim); outline:none; }

select, .btn{
  background: var(--bg-raised); color: var(--text-dim); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 8px 10px; font-family: var(--mono); font-size: 13px; cursor:pointer;
}
select:hover, .btn:hover{ color:var(--text); border-color:#333; }

.stats-strip{
  display:flex; gap:16px; flex-wrap:wrap; color: var(--text-faint); font-size:11.5px;
  margin-bottom: 18px; padding-bottom:14px; border-bottom:1px dashed var(--line);
}
.stats-strip b{ color: var(--text-dim); font-weight:600; }

h2.cat-title{
  font-size: 13px; text-transform:uppercase; letter-spacing:.08em; color: var(--text-dim);
  margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
}
h2.cat-title .n{ color:var(--text-faint); font-weight:400; text-transform:none; letter-spacing:0; }

.entry{
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 11px 13px; margin-bottom: 8px; transition: border-color .12s ease;
}
.entry:hover{ border-color:#2c3230; }
.entry-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.entry-title{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0; }
.entry-title .name{ color:#fff; font-weight:600; font-size:14px; }
.entry-title .version{ color: var(--accent); font-size:12.5px; }
.entry-actions{ display:flex; gap:4px; flex-shrink:0; }
.icon-btn{
  background:none; border:1px solid transparent; color:var(--text-faint); cursor:pointer;
  padding:3px 6px; border-radius:var(--radius); font-family:var(--mono); font-size:12px; line-height:1;
}
.icon-btn:hover{ color:var(--text); border-color:var(--line); background:var(--bg-hover); }
.icon-btn.starred{ color: var(--warn); }

.badge-row{ display:flex; gap:5px; flex-wrap:wrap; margin: 6px 0 5px; }
.badge{ font-size:10.5px; padding:2px 6px; border-radius:2px; border:1px solid var(--line); color:var(--text-dim); background:var(--bg); }
.badge.vendor-rvendor{ color:#a7c9e8; border-color:#2a3f52; }
.badge.vendor-svendor{ color:#e8c78f; border-color:#4a3f2a; }
.badge.tag-android{ color:var(--good); border-color:#2f4a2a; }
.badge.tag-eol{ color:var(--bad); border-color:#4a2a2a; }
.badge.tag-beta{ color:var(--warn); border-color:#4a3a1a; }
.badge.tag-stable{ color:var(--accent); border-color:#1e4a40; }

.entry-meta{ color: var(--text-faint); font-size:11.5px; margin-bottom: 4px; }
.entry-meta span{ margin-right:10px; }
.entry-note{ color: var(--text-dim); font-size:12.5px; line-height:1.5; }
.entry-note.clamped{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.entry-note-toggle{ color:var(--accent-dim); font-size:11px; cursor:pointer; margin-top:3px; display:inline-block; }
.entry-note-toggle:hover{ color:var(--accent); }
.entry-link{
  display:inline-block; margin-top:7px; font-size:12px; color:var(--accent);
  border:1px solid var(--accent-dim); padding:3px 8px; border-radius:var(--radius); word-break: break-all;
}
.entry-link:hover{ background: rgba(125,211,192,0.08); text-decoration:none; }

.empty-state{ text-align:center; color:var(--text-faint); padding: 50px 10px; font-size:13px; }
.empty-state .big{ font-size: 26px; margin-bottom:8px; }

.toast{
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(20px);
  background: var(--bg-raised); border:1px solid var(--accent-dim); color:var(--accent);
  padding:8px 14px; border-radius:var(--radius); font-size:12.5px; opacity:0;
  transition: all .2s ease; pointer-events:none; z-index:50;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.skeleton{
  height:52px; border-radius:var(--radius);
  background:linear-gradient(90deg,var(--bg-raised),var(--bg-hover),var(--bg-raised));
  background-size:200% 100%; animation:shine 1.3s infinite; margin-bottom:8px; border:1px solid var(--line);
}
@keyframes shine{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot">&gt;</span><h1>selenevault</h1></div>
    <div class="tagline">community archive · Xiaomi Redmi 10 (selene)</div>

    <div class="nav-group" id="catNav">
      <div class="nav-label">categories</div>
      <div class="nav-item active" data-cat="all"><span>all</span><span class="count" id="count-all">-</span></div>
    </div>

    <div class="nav-group">
      <div class="nav-label">view</div>
      <div class="nav-item" data-view="favorites"><span>★ favorites</span><span class="count" id="count-fav">0</span></div>
    </div>

    <div class="side-foot">
      <a href="https://github.com/jzadl/selenevault" target="_blank">↗ github repo</a>
      <a href="https://t.me/Redmi10_Community" target="_blank">↗ telegram community</a>
      <span style="color:var(--text-faint); font-size:11px;" id="lastUpdated"></span>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" placeholder="search name, maintainer, note...">
      </div>
      <select id="sortSel">
        <option value="date-desc">newest first</option>
        <option value="date-asc">oldest first</option>
        <option value="name-asc">name a-z</option>
      </select>
      <select id="vendorSel">
        <option value="">all vendors</option>
        <option value="rvendor">rvendor</option>
        <option value="svendor">svendor</option>
      </select>
      <button class="btn" id="clearBtn">clear</button>
    </div>

    <div class="stats-strip" id="statsStrip"></div>

    <div id="out">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="sman-parser.js"></script>
<script>
function esc(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const CATS = [
  { key: "rom",       file: "rom.sman",      label: "ROMs" },
  { key: "kernels",   file: "kernels.sman",  label: "Kernels" },
  { key: "recovery",  file: "recovery.sman", label: "Recovery" },
  { key: "firmware",  file: "firmware.sman", label: "Firmware" },
  { key: "ports",     file: "ports.sman",    label: "Ports" },
  { key: "tools",     file: "tools.sman",    label: "Tools" },
  { key: "guides",    file: "guides.sman",   label: "Guides" },
  { key: "channels",  file: "channels.sman", label: "Channels" },
];

let DATA = {};
let state = {
  cat: "all",
  view: null,
  query: "",
  sort: "date-desc",
  vendor: "",
  expanded: new Set()
};

const FAV_KEY = "selenevault_favs_v1";
function getFavs(){ try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); } catch(e){ return new Set(); } }
function saveFavs(set){ localStorage.setItem(FAV_KEY, JSON.stringify([...set])); }
let favs = getFavs();

function entryId(catKey, e, idx){
  return catKey + ":" + idx + ":" + (e.name||"") + (e.version||"");
}

function parseDate(d){
  if(!d || d.toLowerCase() === "unknown") return null;
  const t = Date.parse(d);
  return isNaN(t) ? null : t;
}

function detectTags(e){
  const tags = [];
  const hay = ((e.note||"") + " " + (e.version||"")).toLowerCase();
  const androidMatch = hay.match(/android\s?(\d{1,2})/);
  if(androidMatch) tags.push({ cls:"tag-android", label:"Android " + androidMatch[1] });
  if(/\beol\b|final/.test(hay)) tags.push({ cls:"tag-eol", label:"EOL" });
  if(/\bbeta\b|\btest\b|unofficial|wip/.test(hay)) tags.push({ cls:"tag-beta", label:"Beta/Test" });
  else if(/stable|official/.test(hay)) tags.push({ cls:"tag-stable", label:"Stable" });
  return tags;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove("show"), 1600);
}

async function loadAll(){
  for(const c of CATS){
    try {
      const text = await (await fetch(c.file)).text();
      const { entries } = parseSman(text);
      DATA[c.key] = entries;
    } catch(err) {
      console.error("Error loading " + c.file, err);
      DATA[c.key] = [];
    }
  }
  buildSidebar();
  buildStats();
  render();
}

function buildSidebar(){
  const nav = document.getElementById("catNav");
  let total = 0;
  CATS.forEach(c => {
    const n = (DATA[c.key]||[]).length;
    total += n;
    const div = document.createElement("div");
    div.className = "nav-item";
    div.dataset.cat = c.key;
    div.innerHTML = `<span>${c.label}</span><span class="count">${n}</span>`;
    nav.appendChild(div);
  });
  document.getElementById("count-all").textContent = total;

  document.querySelectorAll(".nav-item[data-cat]").forEach(el => {
    el.addEventListener("click", () => {
      state.cat = el.dataset.cat;
      state.view = null;
      document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
      el.classList.add("active");
      render();
    });
  });
  document.querySelector('.nav-item[data-view="favorites"]').addEventListener("click", (e) => {
    state.view = "favorites";
    document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
    e.currentTarget.classList.add("active");
    render();
  });
}

function buildStats(){
  const total = CATS.reduce((s,c)=> s+(DATA[c.key]||[]).length, 0);
  let newest = null;
  CATS.forEach(c => (DATA[c.key]||[]).forEach(e => {
    const d = parseDate(e.date);
    if(d && (!newest || d>newest)) newest = d;
  }));
  const strip = document.getElementById("statsStrip");
  strip.innerHTML = `
    <span><b>${total}</b> total entries</span>
    <span><b>${CATS.length}</b> categories</span>
    ${newest ? `<span>latest addition: <b>${new Date(newest).toISOString().slice(0,10)}</b></span>` : ""}
  `;
  if(newest){
    document.getElementById("lastUpdated").textContent = "updated " + new Date(newest).toISOString().slice(0,10);
  }
}

function matchesQuery(e, q){
  if(!q) return true;
  const hay = [e.name, e.maintainer, e.note, e.version, e.vendor].join(" ").toLowerCase();
  return hay.includes(q);
}

function sortEntries(list){
  const arr = [...list];
  if(state.sort === "date-desc"){
    arr.sort((a,b) => (parseDate(b.e.date)||0) - (parseDate(a.e.date)||0));
  } else if(state.sort === "date-asc"){
    arr.sort((a,b) => (parseDate(a.e.date)||0) - (parseDate(b.e.date)||0));
  } else if(state.sort === "name-asc"){
    arr.sort((a,b) => (a.e.name||"").localeCompare(b.e.name||""));
  }
  return arr;
}

function renderEntry(catKey, e, idx){
  const id = entryId(catKey, e, idx);
  const isFav = favs.has(id);
  const isExpanded = state.expanded.has(id);
  const tags = detectTags(e);
  const note = e.note || e.content || "";
  const needsClamp = note.length > 140;

  const vendorBadge = e.vendor ? `<span class="badge vendor-${esc(e.vendor)}">${esc(e.vendor)}</span>` : "";
  const tagBadges = tags.map(t => `<span class="badge ${t.cls}">${esc(t.label)}</span>`).join("");

  return `
  <div class="entry" data-id="${esc(id)}">
    <div class="entry-head">
      <div class="entry-title">
        <span class="name">${esc(e.name||"untitled")}</span>
        ${e.version ? `<span class="version">${esc(e.version)}</span>` : ""}
      </div>
      <div class="entry-actions">
        ${e.url ? `<button class="icon-btn" data-copy="${esc(e.url)}" title="copy link">⧉</button>` : ""}
        <button class="icon-btn ${isFav?'starred':''}" data-fav="${esc(id)}" title="favorite">${isFav ? '★' : '☆'}</button>
      </div>
    </div>
    ${(vendorBadge || tagBadges) ? `<div class="badge-row">${vendorBadge}${tagBadges}</div>` : ""}
    <div class="entry-meta">
      ${e.maintainer ? `<span>by ${esc(e.maintainer)}</span>` : ""}
      ${e.date && e.date!=="unknown" ? `<span>${esc(e.date)}</span>` : ""}
      ${e.size && e.size!=="unknown" ? `<span>${esc(e.size)}</span>` : ""}
    </div>
    ${note ? `<div class="entry-note ${needsClamp && !isExpanded ? 'clamped':''}" data-note-id="${esc(id)}">${esc(note)}</div>` : ""}
    ${needsClamp ? `<span class="entry-note-toggle" data-toggle="${esc(id)}">${isExpanded ? 'show less' : 'show more'}</span>` : ""}
    ${e.url ? `<a class="entry-link" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a>` : ""}
  </div>`;
}

function render(){
  const out = document.getElementById("out");
  const q = state.query.trim().toLowerCase();

  let catsToShow = state.cat === "all" ? CATS : CATS.filter(c => c.key === state.cat);
  let html = "";
  let totalShown = 0;

  catsToShow.forEach(c => {
    let entries = (DATA[c.key] || []).map((e, idx) => ({ e, idx }));

    if(state.view === "favorites"){
      entries = entries.filter(({e, idx}) => favs.has(entryId(c.key, e, idx)));
    }
    if(state.vendor){
      entries = entries.filter(({e}) => e.vendor === state.vendor);
    }
    if(q){
      entries = entries.filter(({e}) => matchesQuery(e, q));
    }
    entries = sortEntries(entries);

    if(entries.length === 0) return;
    totalShown += entries.length;

    html += `<h2 class="cat-title"><span>${c.label}</span><span class="n">${entries.length}</span></h2>`;
    entries.forEach(({e, idx}) => { html += renderEntry(c.key, e, idx); });
  });

  if(totalShown === 0){
    html = `<div class="empty-state"><div class="big">∅</div>
      ${state.view === "favorites" ? "no favorites yet — tap ☆ on any entry to save it here" : "no entries match your filters"}
    </div>`;
  }

  out.innerHTML = html;
  attachEntryEvents();
}

function attachEntryEvents(){
  document.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.fav;
      if(favs.has(id)){ favs.delete(id); } else { favs.add(id); }
      saveFavs(favs);
      document.getElementById("count-fav").textContent = favs.size;
      render();
    });
  });
  document.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        showToast("link copied");
      } catch(e){ showToast("copy failed"); }
    });
  });
  document.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.toggle;
      if(state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      render();
    });
  });
}

document.getElementById("search").addEventListener("input", e => {
  state.query = e.target.value;
  render();
});
document.getElementById("sortSel").addEventListener("change", e => {
  state.sort = e.target.value;
  render();
});
document.getElementById("vendorSel").addEventListener("change", e => {
  state.vendor = e.target.value;
  render();
});
document.getElementById("clearBtn").addEventListener("click", () => {
  state.query = ""; state.vendor = ""; state.sort = "date-desc";
  document.getElementById("search").value = "";
  document.getElementById("vendorSel").value = "";
  document.getElementById("sortSel").value = "date-desc";
  render();
});

document.getElementById("count-fav").textContent = favs.size;
loadAll();
</script>
</body>
</html>
